services:
  - type: web
    name: domo-gourmet-v18
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: HOTPEPPER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_CANDIDATES
        value: gemini-3-flash-preview,gemini-2.5-flash,gemini-3.1-flash-lite-preview,gemini-2.5-flash-lite,gemini-2.0-flash,gemini-2.0-flash-lite
      - key: DATA_FILE_PATH
        value: ./data/store.json
